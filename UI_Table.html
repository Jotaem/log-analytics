<script>
/**
 * Componente Vue: UI_Table
 * Tabla de ranking a nivel de partner con virtual/sticky scrolling,
 * pestañas por grupo y ordenamiento dinámico.
 */
const UI_Table = {
  template: `
    <div ref="tableRoot" class="w-full max-w-7xl mx-auto mb-12"></div>
  `,
  setup() {
    const { ref, watch, onMounted, onUnmounted } = Vue;
    const storeState = Store.state;

    const tableRoot = ref(null);
    const activeGroupId = ref(null);
    const sortKey = ref('total_orders');
    const sortAsc = ref(false); // Por defecto descendente (los mejores primero)
    const selectedDatesByGroup = new Map();
    let dateDropdownOpen = false;

    const columns = [
      { key: 'vendor_code', label: 'ID' },
      { key: 'partner_name', label: 'Nombre' },
      { key: 'franchise_name', label: 'Franquicia' },
      { key: 'is_logistic_marketplace', label: 'Operación' },
      { key: 'is_mall', label: 'Mall' },
      { key: 'total_orders', label: 'Órdenes' },
      { key: 'rejected_orders', label: 'Rechazos' },
      { key: 'fail_rate', label: 'Fail Rate' },
      { key: 'open_time_pct', label: 'Open Time' },
      { key: 'share_over_group', label: 'Share (Grupo)' },
      { key: 'penetracion', label: 'Penetración (Ciudad)' }
    ];

    const escapeHtml = (value) => String(value ?? '-').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[character]));
    const formatNum = (value) => value === null || value === undefined ? '-' : Number(value).toLocaleString('es-CL');
    const formatPct = (value) => value === null || value === undefined ? '-' : (value * 100).toFixed(2) + '%';

    const getGroupsWithData = () => storeState.groups.filter(group =>
      group.aggregatedData && group.aggregatedData.partnerTotals && group.aggregatedData.partnerTotals.length > 0
    );

    const getAvailableDates = group => group.aggregatedData.timeSeries.map(row => row.fecha);

    const getSelectedDates = (group, availableDates) => {
      const selectedDates = selectedDatesByGroup.get(group.id);
      if (!selectedDates) return null;
      const validDates = new Set(availableDates);
      const cleanedDates = new Set([...selectedDates].filter(date => validDates.has(date)));
      selectedDatesByGroup.set(group.id, cleanedDates);
      return cleanedDates;
    };

    const getActivePartnerTotals = (group, availableDates) => {
      const selectedDates = getSelectedDates(group, availableDates);
      if (!selectedDates || selectedDates.size === availableDates.length) return group.aggregatedData.partnerTotals;
      const filteredRawData = group.rawData.filter(row => selectedDates.has(row.fecha));
      return Store.aggregateGroup(filteredRawData).partnerTotals;
    };

    const renderDateFilter = (group, availableDates) => {
      const selectedDates = getSelectedDates(group, availableDates);
      const selectedCount = selectedDates ? selectedDates.size : availableDates.length;
      const allSelected = selectedCount === availableDates.length;
      const label = allSelected ? 'Todas' : `${selectedCount}/${availableDates.length}`;
      const options = availableDates.map(date => `<label data-date-value="${escapeHtml(date)}" class="flex items-center gap-2 text-xs py-0.5 cursor-pointer"><input type="checkbox" ${!selectedDates || selectedDates.has(date) ? 'checked' : ''} />${escapeHtml(date)}</label>`).join('');
      return `<div class="relative" data-date-filter><button data-date-toggle type="button" class="text-xs border border-slate-300 rounded-lg px-3 py-1.5 bg-white hover:bg-slate-50">Fechas: ${label}</button>${dateDropdownOpen ? `<div class="absolute z-20 bg-white border border-slate-200 rounded-lg shadow-lg p-2 max-h-64 overflow-y-auto min-w-44"><label data-date-all class="flex items-center gap-2 text-xs font-semibold border-b border-slate-200 pb-1 mb-1 cursor-pointer"><input type="checkbox" ${allSelected ? 'checked' : ''} />Todas</label>${options}</div>` : ''}</div>`;
    };

    const sortPartners = partners => [...partners].sort((first, second) => {
      let firstValue = first[sortKey.value];
      let secondValue = second[sortKey.value];
      if (firstValue === null || firstValue === undefined) firstValue = sortAsc.value ? Infinity : -Infinity;
      if (secondValue === null || secondValue === undefined) secondValue = sortAsc.value ? Infinity : -Infinity;
      if (firstValue < secondValue) return sortAsc.value ? -1 : 1;
      if (firstValue > secondValue) return sortAsc.value ? 1 : -1;
      return 0;
    });

    const sortIcon = key => sortKey.value !== key ? '' : `<svg class="w-3 h-3 fill-current" viewBox="0 0 16 16" aria-hidden="true"><path d="${sortAsc.value ? 'M8 2L13 8H10V14H6V8H3L8 2Z' : 'M8 14L3 8H6V2H10V8H13L8 14Z'}"/></svg>`;

    const renderTable = () => {
      if (!tableRoot.value) return;
      const loading = storeState.groups.some(group => group.loading);
      const errorGroup = storeState.groups.find(group => group.error);
      const groups = getGroupsWithData();

      if (loading) {
        tableRoot.value.innerHTML = '<div class="w-full bg-white shadow-sm rounded-xl border border-slate-200 p-8 mb-12 text-center text-sm text-slate-400">Cargando ranking de partners...</div>';
        return;
      }
      if (errorGroup) {
        tableRoot.value.innerHTML = `<div class="w-full bg-white shadow-sm rounded-xl border border-red-200 p-8 mb-12 text-center text-sm text-red-600">${escapeHtml(errorGroup.error)}</div>`;
        return;
      }
      if (groups.length === 0) {
        tableRoot.value.innerHTML = '';
        return;
      }

      if (!activeGroupId.value || !groups.some(group => group.id === activeGroupId.value)) activeGroupId.value = groups[0].id;
      const activeGroup = groups.find(group => group.id === activeGroupId.value);
      const availableDates = getAvailableDates(activeGroup);
      const rows = sortPartners(getActivePartnerTotals(activeGroup, availableDates));
      const headers = columns.map(column => `<th data-sort-key="${column.key}" class="px-4 py-3 cursor-pointer hover:bg-slate-100 select-none whitespace-nowrap"><div class="flex items-center gap-1">${escapeHtml(column.label)}${sortIcon(column.key)}</div></th>`).join('');
      const body = rows.length === 0 ? '<tr><td colspan="11" class="px-4 py-8 text-center text-slate-400">No hay datos para mostrar en este grupo.</td></tr>' : rows.map(partner => `<tr class="hover:bg-slate-50 transition-colors">
        <td class="px-4 py-2 font-medium text-peya-navy-90">${escapeHtml(partner.vendor_code)}</td>
        <td class="px-4 py-2 font-medium text-peya-navy-90 truncate max-w-[200px]" title="${escapeHtml(partner.partner_name)}">${escapeHtml(partner.partner_name)}</td>
        <td class="px-4 py-2 truncate max-w-[150px]">${escapeHtml(partner.franchise_name)}</td>
        <td class="px-4 py-2"><span class="px-2 py-1 text-[10px] rounded-full font-medium ${partner.is_logistic_marketplace === 'Logistic' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}">${escapeHtml(partner.is_logistic_marketplace)}</span></td>
        <td class="px-4 py-2 text-center">${partner.is_mall ? '<svg class="w-4 h-4 mx-auto fill-current text-peya-positive" viewBox="0 0 16 16" aria-label="Mall"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor"/><path d="M5 8l2 2 4-4" fill="none" stroke="currentColor"/></svg>' : '<span class="text-peya-navy-60">-</span>'}</td>
        <td class="px-4 py-2 text-right">${formatNum(partner.total_orders)}</td><td class="px-4 py-2 text-right text-red-600">${formatNum(partner.rejected_orders)}</td>
        <td class="px-4 py-2 text-right font-medium">${formatPct(partner.fail_rate)}</td><td class="px-4 py-2 text-right">${formatPct(partner.open_time_pct)}</td>
        <td class="px-4 py-2 text-right text-blue-600 font-medium">${formatPct(partner.share_over_group)}</td><td class="px-4 py-2 text-right text-emerald-600 font-medium">${formatPct(partner.penetracion)}</td>
      </tr>`).join('');
      tableRoot.value.innerHTML = `<div class="w-full bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden mb-12"><div class="px-6 pt-6 border-b border-slate-200"><div class="flex flex-wrap justify-between items-center gap-3"><h2 class="text-xl font-bold text-slate-800">Ranking de Partners</h2>${renderDateFilter(activeGroup, availableDates)}</div><div class="flex gap-4 overflow-x-auto mt-4">${groups.map(group => `<button data-group-id="${escapeHtml(group.id)}" class="pb-3 px-1 text-sm font-medium border-b-2 whitespace-nowrap transition-colors ${activeGroupId.value === group.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}">${escapeHtml(group.label)}</button>`).join('')}</div></div><div class="overflow-x-auto max-h-[600px]"><table class="min-w-full text-left text-sm text-slate-600"><thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500 sticky top-0 shadow-sm z-10"><tr>${headers}</tr></thead><tbody class="divide-y divide-slate-100">${body}</tbody></table></div></div>`;
    };

    const handleClick = event => {
      const groupButton = event.target.closest('[data-group-id]');
      const sortHeader = event.target.closest('[data-sort-key]');
      const dateToggle = event.target.closest('[data-date-toggle]');
      const dateAll = event.target.closest('[data-date-all]');
      const dateOption = event.target.closest('[data-date-value]');
      if (groupButton) {
        activeGroupId.value = groupButton.dataset.groupId;
        dateDropdownOpen = false;
      }
      if (sortHeader) {
        const key = sortHeader.dataset.sortKey;
        if (sortKey.value === key) sortAsc.value = !sortAsc.value;
        else { sortKey.value = key; sortAsc.value = false; }
      }
      if (dateToggle) dateDropdownOpen = !dateDropdownOpen;
      if (dateAll || dateOption) {
        const activeGroup = storeState.groups.find(group => group.id === activeGroupId.value);
        const availableDates = activeGroup ? getAvailableDates(activeGroup) : [];
        if (activeGroup) {
          if (dateAll) selectedDatesByGroup.set(activeGroup.id, null);
          else {
            const selectedDates = getSelectedDates(activeGroup, availableDates) || new Set(availableDates);
            const date = dateOption.dataset.dateValue;
            selectedDates.has(date) ? selectedDates.delete(date) : selectedDates.add(date);
            selectedDatesByGroup.set(activeGroup.id, selectedDates);
          }
        }
        dateDropdownOpen = true;
      }
      if (groupButton || sortHeader || dateToggle || dateAll || dateOption) renderTable();
    };

    watch(() => [storeState.version, activeGroupId.value, sortKey.value, sortAsc.value], renderTable, { flush: 'post' });
    onMounted(() => { tableRoot.value.addEventListener('click', handleClick); renderTable(); });
    onUnmounted(() => tableRoot.value && tableRoot.value.removeEventListener('click', handleClick));

    return { tableRoot };
  }
};
</script>
